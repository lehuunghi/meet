<!doctype html>
<html lang="vi">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Meet · Quản trị trung tâm</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f7f8fa;
      color: #202124;
      font: 14px system-ui;
    }
    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    h2 {
      font-size: 18px;
    }
    h3 {
      font-size: 15px;
    }
    main {
      max-width: 1280px;
      margin: auto;
      padding: 24px;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      border: 1px solid #cbd0d7;
      border-radius: 6px;
      padding: 9px;
    }
    button {
      cursor: pointer;
      background: white;
      color: #174ea6;
    }
    button.primary {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    input,
    textarea,
    select {
      width: 100%;
      background: white;
    }
    label {
      display: block;
      margin: 10px 0;
      color: #444;
    }
    label span {
      display: block;
      margin-bottom: 5px;
    }
    section,
    .card {
      background: white;
      border: 1px solid #e0e3e7;
      border-radius: 10px;
      padding: 20px;
      margin: 16px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .toolbar,
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .table {
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }
    th,
    td {
      text-align: left;
      padding: 12px;

    }
    th {

      color: #666;
    }
    p {
      color: #5f6368;
      line-height: 1.5;
    }
    .badge {
      background: #eef3fc;
      padding: 4px 8px;
      border-radius: 20px;
    }
    #message {
      position: sticky;
      top: 0;
      background: #fff7df;
      padding: 12px;
      border-radius: 6px;
      display: none;
      z-index: 5;
    }
    .login {
      max-width: 420px;
      margin: 10vh auto;
    }
    dialog {
      border: 1px solid #ddd;
      border-radius: 12px;
      width: min(900px, 96vw);
      max-height: 90vh;
      padding: 24px;
    }
    dialog::backdrop {
      background: #0006;
    }
    .row {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 7px;
      margin: 8px 0;
    }
    small {
      color: #666;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
    a {
      color: #1967d2;
    }
    body {
      background: #f5f7fb;
      color: #20324e;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    header {
      border-color: #e2e8f0;
      padding: 18px 28px;
      gap: 16px;
    }
    header small {
      font-size: 12px;
      font-weight: 400;
      margin-left: 8px;
    }
    #identity {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #64748b;
    }
    h2 {
      letter-spacing: -0.4px;
      margin: 0 0 12px;
    }
    h3 {
      color: #334966;
    }
    p {
      color: #64748b;
      line-height: 1.7;
    }
    section,
    .card {
      border-color: #e2e8f0;
      box-shadow: 0 2px 4px #172b4d03;
      border-radius: 12px;
    }
    button {
      min-height: 38px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 600;
      color: #365681;
      border-color: #d5deeb;
    }
    button:hover {
      background: #f0f5ff;
    }
    button.primary {
      background: #245de5;
      border-color: #245de5;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #8cafff;
      outline-offset: 3px;
    }
    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #4c7bed;
      box-shadow: 0 0 0 3px #245de514;
    }
    label {
      font-size: 12px;
      color: #52637b;
    }
    input,
    textarea,
    select {
      padding: 11px;
      color: #203654;
      border-color: #d5deeb;
    }
    .toolbar h2 {
      margin: 0 auto 0 0;
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px 190px;
      gap: 16px;

    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 4px 8px;

    }
    .tabs {

      overflow-x: auto;

    }
    .tabs button {

      border-color: transparent;

    }
    .tabs button.active {
      color: #1d50cb;
      background: #edf3ff;
    }
    dialog {
      border-color: #dce4f0;
      padding: 24px;
      width: min(1080px, 96vw);
      box-shadow: 0 24px 80px #172b4d26;
    }
    #dialogtop {

      top: -24px;
      background: white;
      z-index: 2;
      padding: 12px 0;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .summary-grid article {
      border: 1px solid #e2e8f0;
      background: #f8faff;

    .checklist {

    }

      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;

    }
    .state-optional {
      color: #966022;
      background: #fff8e8;
    }
    .intro {
      padding: 14px 16px;
      background: #edf3ff;
      color: #42618f;
      border-radius: 8px;
      font-size: 13px;
    }
    th {
      background: #f8fafd;
      color: #52637b;
    }
    td {
      font-size: 13px;
    }
    .table {
      padding: 0;
    }
    .table tbody tr:hover {
      background: #f9fbff;
    }
    .install-hint {
      padding: 12px 14px;
      background: #fff8e8;
      color: #966022;
      border-radius: 8px;
    }
    .links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 16px;
      font-size: 13px;
    }
    .step-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    code {
      overflow-wrap: anywhere;
    }
    .control-workspace {
      display: grid;
      grid-template-columns: 214px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .workspace-side {
      position: sticky;
      top: 20px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
    }
    .workspace-side strong {
      display: block;
      font-size: 14px;
      overflow-wrap: anywhere;
      margin-bottom: 6px;
    }
    .workspace-main {
      min-width: 0;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
    }
    #workspace #tabs {
      display: grid;
      max-height: calc(100dvh - 170px);
      gap: 3px;
      overflow: auto;
      border: 0;
      margin: 16px 0 0;
      padding: 0;
    }
    #workspace #tabs button {
      text-align: left;
      white-space: normal;
    }
    #workspace #dialogtop {
      position: static;
      padding: 0 0 18px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .workspace-main .intro {
      margin-top: 0;
    }
    .bootstrap-banner {
      padding: 20px;
      background: #edf3ff;
      border: 1px solid #d6e4ff;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .bootstrap-banner h3 {
      margin: 0 0 8px;
      color: #214d9b;
    }
    @media (max-width: 800px) {
      .control-workspace {
        display: block;
      }
      .workspace-side {
        position: static;
        margin-bottom: 16px;
      }
      .workspace-main {
        padding: 16px;
      }
      #workspace #tabs {
        display: flex;
        overflow-x: auto;
        max-height: none;
      }
      #workspace #tabs button {
        white-space: nowrap;
      }
      .workspace-side strong {
        display: inline;
        margin-right: 10px;
      }
    }
    @media (max-width: 600px) {
      main {
        padding: 12px;
      }
      header {
        padding: 14px;
        align-items: flex-start;
        flex-direction: column;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      section {
        padding: 14px;
      }
      .filters,
      .summary-grid {
        grid-template-columns: 1fr;
      }
      .filters {
        gap: 0;
      }
      .summary-grid {
        gap: 8px;
      }
      .summary-grid article {
        padding: 12px;
      }
      dialog {
        padding: 16px;
      }
      #dialogtop {
        top: -16px;
      }
      input,
      select,
      textarea {
        font-size: 16px;
      }
      #identity {
        font-size: 11px;
      }
      .toolbar {
        align-items: flex-start;
      }
      .toolbar h2 {
        flex-basis: 100%;
      }
      .table {
        padding: 0;
      }
    }
    .job-progress {
      display: grid;
      gap: 6px;
      min-width: 160px;
    }
    .job-progress progress {
      width: 100%;
      height: 12px;
      accent-color: #2563eb;
    }
    .job-console {
      background: #101827;
      color: #dce7fb;
      border-radius: 10px;
      padding: 16px;
      max-height: 360px;
      overflow: auto;
      white-space: pre-wrap;
      font:
        12px/1.8 ui-monospace,
        monospace;
    }
    .job-monitor {
      width: min(780px, 92vw);
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      padding: 24px;
    }
    .job-monitor::backdrop {
      background: #14213d66;
    }
    .backup-note {
      border-left: 3px solid #d09a30;
      padding: 12px;
      background: #fff9e9;
    }
  </style>
  <header>
    <h1>m·meet <small>Quản trị trung tâm</small></h1>
    <div id="identity"></div>
  </header>
  <main>
    <div id="message" role="alert"></div>
    <div id="content"></div>
  </main>
  <dialog id="modal"></dialog>
  <script>
    const $ = (s) => document.querySelector(s),
      esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
    let schools = [],
      selected = null,
      cfg = {},
      tab = "general",
      me = null,
      dirty = false,
      jobTimer = null,
      syncTimer = null,
      viewMode = "";
    function viewOpen() {
      return !!$("#workspace") || $("#modal").open;
    }
    $("#modal").addEventListener("close", () => clearTimeout(jobTimer));
    document.addEventListener("input", (e) => {
      if (e.target.closest("#configform")) dirty = true;
    });
    function msg(s) {
      $("#message").textContent = s;
      $("#message").style.display = "block";
    }
    async function api(path, data) {
      const r = await fetch("/api/" + path, {
        method: data === undefined ? "GET" : "POST",
        headers: { "Content-Type": "application/json" },
        body: data === undefined ? undefined : JSON.stringify(data),
      });
      const v = await r.json();
      if (!r.ok) throw Error(v.error || "Chưa hoàn tất");
      return v;
    }
    function input(name, label, value = "", type = "text") {
      return `<label><span>${esc(label)}</span><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${type === "password" ? 'autocomplete="new-password"' : ""}></label>`;
    }
    function check(name, label, value) {
      return `<label><input style="width:auto" type="checkbox" name="${name}" ${value ? "checked" : ""}> ${esc(label)}</label>`;
    }
    function button(text, fn, cls = "") {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.className = cls;
      b.onclick = async () => {
        b.disabled = true;
        try {
          await fn();
        } catch (e) {
          msg(e.message);
        } finally {
          b.disabled = false;
        }
      };
      return b;
    }
    async function boot() {
      try {
        me = await api("me");
        await list();
        const match = location.hash.match(/^#academy\/([a-f0-9]{32})$/);
        if (match) {
          const unit = schools.find(
            (s) => s.id === match[1] && s.platform_mode === "academy",
          );
          if (unit) await edit(unit);
        }
      } catch {
        login();
      }
    }
    function login(challenge = "") {
      $("#identity").textContent = "";
      $("#content").innerHTML =
        '<section class="login"><h2>' +
        (challenge ? "Xác thực hai bước" : "Đăng nhập quản trị trung tâm") +
        '</h2><form id="login">' +
        (challenge
          ? input("code", "Mã xác thực hoặc mã khôi phục")
          : input("email", "Email", "", "email") +
            input("password", "Mật khẩu", "", "password")) +
        '<button class="primary">' +
        (challenge ? "Xác thực" : "Đăng nhập") +
        "</button></form></section>";
      if (challenge) $("#login").append(button("Quay lại", () => login()));
      $("#login").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const f = Object.fromEntries(new FormData(e.target));
          const result = await api(
            challenge ? "login/2fa" : "login",
            challenge ? { challenge, code: f.code } : f,
          );
          if (result.requires_2fa) login(result.challenge);
          else await boot();
        } catch (e) {
          msg(e.message);
        }
      };
    }
    async function security() {
      me = await api("me");
      const d = $("#modal");
      d.innerHTML =
        "<h2>Bảo mật tài khoản</h2><p>2FA: " +
        (me.mfa_enabled ? "Đang bật" : "Chưa bật") +
        '</p><form id="security">' +
        input("password", "Mật khẩu hiện tại", "", "password") +
        (me.mfa_enabled ? input("code", "Mã xác thực hoặc mã khôi phục") : "") +
        '<button class="primary">' +
        (me.mfa_enabled ? "Tắt 2FA" : "Thiết lập 2FA") +
        "</button></form>";
      d.append(button("Đóng", () => d.close()));
      if (!d.open) d.showModal();
      const profile = document.createElement("section");
      profile.innerHTML =
        '<h3>Email & mật khẩu đăng nhập trung tâm</h3><p>Thay đổi này chỉ áp dụng tài khoản trung tâm của bạn. Sau khi lưu, đăng nhập lại bằng thông tin mới.</p><form id="own-profile">' +
        input("email", "Email quản trị", me.email, "email") +
        input(
          "current_password",
          "Mật khẩu hiện tại để xác nhận",
          "",
          "password",
        ) +
        input(
          "new_password",
          "Mật khẩu mới (để trống nếu giữ nguyên)",
          "",
          "password",
        ) +
        (me.mfa_enabled
          ? input("code", "Mã 2FA / khôi phục xác nhận thay đổi")
          : "") +
        '<button class="primary">Lưu email / mật khẩu</button></form>';
      d.insertBefore(profile, d.querySelector("#security"));
      $("#own-profile").onsubmit = async (e) => {
        e.preventDefault();
        const form = e.currentTarget,
          submit = form.querySelector("button");
        submit.disabled = true;
        try {
          await api("profile", Object.fromEntries(new FormData(form)));
          form.reset();
          d.close();
          login();
          msg("Đã cập nhật. Đăng nhập lại bằng email và mật khẩu mới.");
        } catch (e) {
          msg(e.message);
        } finally {
          submit.disabled = false;
        }
      };
      $("#security").onsubmit = async (e) => {
        e.preventDefault();
        const values = Object.fromEntries(new FormData(e.target));
        try {
          if (me.mfa_enabled) {
            await api("security", { ...values, action: "disable" });
            d.close();
            login();
            msg("Đã tắt 2FA. Đăng nhập lại.");
            return;
          }
          const result = await api("security", {
            password: values.password,
            action: "setup",
          });
          d.innerHTML =
            '<h2>Kết nối ứng dụng xác thực</h2><p>Thêm tài khoản TOTP trong ứng dụng xác thực bằng khóa sau. Khóa chỉ dùng cho tài khoản của anh.</p><label>Khóa thiết lập<input readonly value="' +
            esc(result.secret) +
            '"></label><form id="enablemfa">' +
            input("code", "Mã 6 chữ số từ ứng dụng") +
            '<button class="primary">Bật 2FA</button></form>';
          d.append(button("Hủy", () => d.close()));
          $("#enablemfa").onsubmit = async (event) => {
            event.preventDefault();
            try {
              const enabled = await api("security", {
                password: values.password,
                action: "enable",
                code: new FormData(event.target).get("code"),
              });
              d.innerHTML =
                '<h2>Lưu mã khôi phục</h2><p>Mỗi mã dùng một lần. Lưu ở nơi riêng trước khi đăng nhập lại.</p><pre id="recoverycodes"></pre>';
              $("#recoverycodes").textContent =
                enabled.recovery_codes.join("\n");
              d.append(
                button("Đã lưu · Đăng nhập lại", () => {
                  d.close();
                  login();
                }),
              );
            } catch (e) {
              msg(e.message);
            }
          };
        } catch (e) {
          msg(e.message);
        }
      };
    }
    async function list() {
      schools = await api("schools");
      $("#identity").textContent = me.email + " · " + me.role;
      $("#identity").append(
        button("Đăng xuất", async () => {
          await api("logout", {});
          login();
        }),
      );
      $("#content").innerHTML =
        '<div class="toolbar" id="actions"><h2>Nền tảng & VPS</h2></div><p>Quản lý trường nội bộ và nền tảng khóa học/VIP riêng biệt. Cấu hình chỉ hoàn tất khi VPS xác nhận đã áp dụng.</p><div class="filters"><label><span>Tìm đơn vị hoặc domain</span><input id="search" placeholder="Nhập tên hoặc domain"></label><label><span>Loại nền tảng</span><select id="modefilter"><option value="">Tất cả nền tảng</option><option value="school">Trường học nội bộ</option><option value="academy">Khóa học / VIP</option></select></label><label><span>Trạng thái</span><select id="statefilter"><option value="active">Hoạt động</option><option value="suspended">Tạm ngưng</option><option value="deleted">Thùng rác</option></select></label></div><section class="table"><table><thead><tr><th>Đơn vị / Loại nền tảng</th><th>Domain / VPS</th><th>Phiên bản</th><th>Đồng bộ</th><th>Kết nối</th><th>Đang học</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>';
      if (me.role !== "viewer")
        $("#actions").append(
          button("+ Trường nội bộ", () => edit(null, "school")),
        );
      if (me.role === "owner")
        $("#actions").append(
          button(
            "+ Nền tảng khóa học / VIP",
            () => edit(null, "academy"),
            "primary",
          ),
        );
      $("#actions").append(
        button("Tải lại", list),
        button("Bảo mật tài khoản", security),
      );
      $("#actions").append(button("Nhật ký", audit));
      if (me.role === "owner")
        $("#actions").append(button("Quản trị trung tâm", admins));
      $("#search").oninput = renderRows;
      $("#modefilter").onchange = renderRows;
      $("#modefilter").value = viewMode;
      $("#modefilter").onchange = () => {
        viewMode = $("#modefilter").value;
        renderRows();
      };

    async function academyRequest(method, path, body = {}) {
      if (!selected || me.role !== "owner")
        throw Error("Chọn trung tâm và dùng tài khoản chủ hệ thống.");
      const st = JSON.parse(selected.status);
      if (
        Date.now() / 1000 - selected.seen >= 90 ||
        selected.applied !== selected.revision ||
        !st.features?.includes("academy_management")
      )
        throw Error(
          "VPS cần kết nối, đồng bộ cấu hình và hỗ trợ quản trị khóa học. Xem Tổng quan trước.",
        );
      const out = await api("schools/" + selected.id + "/action", {
        action: "academy",
        payload: { method, path, body },
      });
      for (let i = 0; i < 50; i++) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const list = await api("schools/" + selected.id + "/jobs");
        const job = list.find((j) => j.id === out.id);
        if (job?.state === "failed")
          throw Error(
            "VPS chưa xử lý được. Kiểm tra phiên bản và chế độ nền tảng.",
          );
        if (job?.state === "success") {
          const r =
            typeof job.result === "string"
              ? JSON.parse(job.result)
              : job.result;
          if (!r.data) throw Error("Kết quả đã hết hạn; tải lại dữ liệu.");
          return r.data.data;
        }
      }
      throw Error("Đang chờ agent; xem tab Tác vụ trước khi gửi lại thao tác.");
    }

    function jobBar(job) {

        percent =
          last?.percent ??
          (job.state === "success" &&
          (!job.progress?.length || job.action !== "provision")
            ? 100
            : 0);
      return (
        '<div class="job-progress"><progress max="100" value="' +
        percent +
        '" aria-label="Tiến độ tác vụ"></progress><small>' +
        esc(
          last?.label ||
            {
              queued: "Đang chờ",
              running: "Đang xử lý",
              success: "Đã hoàn tất",
              failed: "Không hoàn tất",
            }[job.state] ||
            job.state,
        ) +
        " · " +
        percent +
        "%</small></div>"
      );
    }

      dialog.append(button("Đóng màn hình", () => dialog.close()));

          const job = list.find((j) => j.id === id);
          if (!job) throw Error("Không tìm thấy tác vụ");
          $("#job-state").innerHTML =
            jobBar(job) +
            "<p>" +
            esc(jobMessage(JSON.parse(job.result).code)) +
            "</p>";
          $("#job-console").textContent =
            (job.progress || [])
              .map(
                (e) =>
                  new Date(e.at * 1000).toLocaleTimeString("vi-VN") +

                  e.percent +
                  "%  " +
                  e.label,
              )
              .join("\n") || "Đang chờ tác vụ bắt đầu.";
          if (job.state === "failed")
            $("#job-console").textContent +=
              "\nDừng an toàn: " + jobMessage(JSON.parse(job.result).code);
          if (
            ["queued", "running"].includes(job.state) ||
            (job.action === "provision" &&
              job.progress?.length &&
              job.state === "success" &&
              (job.progress?.at(-1)?.percent || 0) < 100)
          )
            timer = setTimeout(() => void load(), 2000);
        } catch (e) {
          if (dialog.open && dialog.dataset.job===id) $("#job-state").textContent = e.message;
        }
      };
      await load();

      const rows = JSON.parse(selected.status).admins || [];
      p.innerHTML =
        '<p>Tài khoản do VPS báo về. Nhập đúng ID và revision khi thay đổi. Quản trị gốc được bảo vệ theo chính sách hiện có.</p><div class="table"><table><tr><th>ID</th><th>Email</th><th>Tên</th><th>Revision</th></tr>' +
        rows
          .map(
            (a) =>
              `<tr><td>${esc(a.id)}</td><td>${esc(a.email)}</td><td>${esc(a.name)}</td><td>${esc(a.revision)}</td></tr>`,
          )
          .join("") +
        '</table></div><form id="account"><div class="grid">' +
        input("id", "ID (trống để tạo mới)") +
        input("revision", "Revision", 0, "number") +
        input("email", "Email", "", "email") +
        input("name", "Tên") +
        input("password", "Mật khẩu tài khoản mới", "", "password") +
        '</div><label>Trạng thái<select name="state"><option value="active">Hoạt động</option><option value="suspended">Tạm ngưng</option><option value="disabled">Vô hiệu hóa</option></select></label><div id="permissions"></div><button>Lưu tài khoản</button></form>';
      for (const [id, title] of [
        ["academic", "Học vụ"],
        ["accounts", "Tài khoản"],
        ["attendance", "Điểm danh"],
        ["meetings", "Buổi học"],
        ["recordings", "Bản ghi"],
        ["audit", "Nhật ký"],
        ...(cfg.platform_mode === "academy"
          ? [
              ["content", "Nội dung khóa học"],
              ["finance", "Tài chính / VIP"],
            ]
          : []),
      ])
        $("#permissions").insertAdjacentHTML(
          "beforeend",
          check(id, title, true),
        );
      $("#account").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target),
          data = Object.fromEntries(fd);
        data.revision = Number(data.revision);
        data.permissions = [
          "academic",
          "accounts",
          "attendance",
          "meetings",
          "recordings",
          "audit",
          "content",
          "finance",
        ].filter((k) => fd.has(k));
        for (const k of data.permissions) delete data[k];
        try {
          await action("accounts", data);
          e.target.reset();
        } catch (e) {
          msg(e.message);
        }
      };
      if (me.role === "viewer")
        for (const e of p.querySelectorAll("button,input,select"))
          e.disabled = true;
    }
    async function audit() {
      const rows = await api("audit");
      const d = $("#modal");
      d.innerHTML =
        '<h2>Nhật ký trung tâm</h2><div class="table"><table><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Đối tượng</th></tr>' +
        rows
          .map(
            (r) =>
              `<tr><td>${new Date(r.at * 1000).toLocaleString("vi-VN")}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td>${esc(r.target)}</td></tr>`,
          )
          .join("") +
        "</table></div>";
      d.append(button("Đóng", () => d.close()));
      if (!d.open) d.showModal();
    }
    async function admins() {
      const rows = await api("admins");
      const d = $("#modal");
      d.innerHTML =
        '<h2>Tài khoản quản trị trung tâm</h2><div class="table"><table><tr><th>ID</th><th>Email</th><th>Quyền</th><th>Hoạt động</th><th></th></tr>' +
        rows
          .map(
            (r) =>
              `<tr data-admin="${esc(r.id)}"><td>${esc(r.id)}</td><td>${esc(r.email)}</td><td>${esc(r.role)}</td><td>${r.active ? "Có" : "Không"}</td><td></td></tr>`,
          )
          .join("") +
        '</table></div><form id="admins">' +
        input("id", "ID (trống để tạo mới)") +
        input("email", "Email", "", "email") +
        input(
          "password",
          "Mật khẩu mới (để trống nếu giữ nguyên)",
          "",
          "password",
        ) +
        '<label>Quyền<select name="role"><option value="operator">Vận hành</option><option value="viewer">Chỉ xem</option><option value="owner">Chủ hệ thống</option></select></label>' +
        check("active", "Hoạt động", true) +
        "<button>Lưu</button></form>";
      d.append(button("Đóng", () => d.close()));
      if (!d.open) d.showModal();
      for (const row of rows) {
        d.querySelector('[data-admin="' + row.id + '"] td:last-child').append(
          button("Chỉnh sửa", () => {
            const f = $("#admins");
            f.elements.id.value = row.id;
            f.elements.email.value = row.email;
            f.elements.password.value = "";
            f.elements.role.value = row.role;
            f.elements.active.checked = !!row.active;
            f.scrollIntoView({ block: "nearest" });
          }),
        );
      }
      $("#admins").onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        try {
          await api("admins", {
            ...Object.fromEntries(f),
            active: f.has("active"),
          });
          if (f.get("id") === me.id) {
            d.close();
            login();
            msg("Thông tin tài khoản đã thay đổi. Đăng nhập lại.");
          } else await admins();
        } catch (e) {
          msg(e.message);
        }
      };
    }
    boot();
  </script>
</html>
