server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 4m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.r2.cloudflarestorage.com; media-src 'self' blob:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location / { try_files $uri /index.html; }
}
