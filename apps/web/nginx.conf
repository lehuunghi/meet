server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.r2.cloudflarestorage.com; media-src 'self' blob: https://*.r2.cloudflarestorage.com; img-src 'self' data: https://*.r2.cloudflarestorage.com https://img.vietqr.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location = / { proxy_pass http://api:8080/website; proxy_set_header Host $host; proxy_intercept_errors on; error_page 418 =200 /index.html; }
 location /khoa-hoc/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /chinh-sach/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /bai-viet/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location = /sitemap.xml { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location = /robots.txt { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location / { try_files $uri /index.html; }
}
