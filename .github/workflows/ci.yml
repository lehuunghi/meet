name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: apps/recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/recorder/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test browser-test.mjs
      - run: docker build -f apps/recorder/Dockerfile apps -t meet-recorder:ci
        working-directory: .
      - run: bash -n deploy/install-recorder.sh
        working-directory: .
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography python3-paramiko
      - run: /usr/bin/python3 control/test_control.py
      - run: /usr/bin/python3 control/test_agent.py
      - run: /usr/bin/python3 -m py_compile control/server.py control/agent.py control/provision.py
      - run: bash -n control/install.sh control/install-agent.sh deploy/install.sh
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: meet_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost -pci-only-password" --health-interval=10s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/install.sh deploy/init-secrets.sh deploy/install-update-agent.sh deploy/enable-updates.sh
        working-directory: .
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
        working-directory: .
      - run: /usr/bin/python3 deploy/update_test.py
        working-directory: .
      - run: /usr/bin/python3 deploy/backup_test.py
        working-directory: .
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race -count=1 -v ./...
        env:
          TEST_MYSQL_DSN: root:ci-only-password@tcp(127.0.0.1:3306)/meet_test?parseTime=true&loc=UTC
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: go build ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash deploy/init-secrets.sh
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          APP_ORIGIN: http://localhost:8080
      - run: docker compose -f deploy/compose.yaml up --build -d
        env:
          APP_ORIGIN: http://localhost:8080
      - run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/compose.yaml logs
          exit 1
        env:
          APP_ORIGIN: http://localhost:8080
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - run: sudo --preserve-env=APP_ORIGIN,MEET_DISPOSABLE_BACKUP_TEST python3 deploy/backup_integration.py
        env:
          APP_ORIGIN: http://localhost:8080
          MEET_DISPOSABLE_BACKUP_TEST: 'true'
      - run: sudo --preserve-env=APP_ORIGIN,MEET_DISPOSABLE_BACKUP_TEST python3 deploy/update_integration.py
        env:
          APP_ORIGIN: http://localhost:8080
          MEET_DISPOSABLE_BACKUP_TEST: 'true'
      - run: docker compose -f deploy/compose.yaml down -v
        if: always()
        env:
          APP_ORIGIN: http://localhost:8080
